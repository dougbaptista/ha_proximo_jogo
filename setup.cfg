[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,.venv,venv,.pytest_cache,build,dist
# Tabela gerada: as URLs do ge não cabem em 88 colunas.
per-file-ignores = custom_components/proximo_jogo/clubes.py:E501

[isort]
profile = black
line_length = 88

[tool:pytest]
testpaths = tests
addopts = -q
